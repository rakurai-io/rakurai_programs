[package]
name = "rakurai_cli"
version = "2.1.1"
description = "Command-line tools for Rakurai validator operators and transaction-inclusion partners"
edition = "2021"

[dependencies]
anchor-lang = { path = "../../anchor/lang" }
bincode = { workspace = true }
bs58 = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"
rakurai_activation = { path = "../programs/rakurai_activation" }
reward_distribution = { path = "../programs/reward_distribution", features = ["no-entrypoint"] }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
shellexpand = "3.1.0"
solana-account = { workspace = true }
solana-account-decoder-client-types = { workspace = true }
solana-instruction = { workspace = true, features = ["serde"] }
solana-message = { workspace = true, features = ["serde"] }
solana-pubkey = { workspace = true, features = ["serde"] }
solana-rent = { workspace = true }
solana-signature = { workspace = true, features = ["serde"] }
solana-signer = { workspace = true }
solana-transaction = { workspace = true, features = ["serde"] }
solana-keypair = { workspace = true }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-vote-program = { workspace = true }
solana-commitment-config = { workspace = true }
solana-system-interface = { workspace = true }

[[bin]]
name = "rakurai-activation"
path = "src/bin/rakurai_activation_cli.rs"

[[bin]]
name = "rakurai-revshare"
path = "src/bin/rakurai_revshare_cli.rs"
