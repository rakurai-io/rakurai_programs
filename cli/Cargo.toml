[package]
name = "rakurai_cli"
version = "0.1.2"
description = "Created with Anchor"
edition = "2021"

[dependencies]
anchor-lang = { git = "https://github.com/coral-xyz/anchor.git", rev = "8b391aa278387b6f6ce3133453619a175544631e" }
bincode = "1.3.3"
bs58 = "0.5.1"
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"
rakurai_activation = { path = "../programs/rakurai_activation" }
solana-sdk = "=2.1.21"  
serde = "1.0.219"
serde_derive = "1.0.219"
serde_json = "1.0.142"
shellexpand = "3.1.0"
solana-instruction = { version = "3.0.0", features = ["serde"] }
solana-message = { version = "3.0.1", features = ["serde"] }
solana-pubkey = { version = "3.0.0", features = ["serde"] }
solana-signature = { version = "3.1.0", features = ["serde"] }
solana-signer = "3.0.0"
solana-transaction = { version = "3.0.1", features = ["serde"] }
solana-keypair = "3.0.1"
solana-rpc-client = "3.0.6"
solana-rpc-client-api = "3.0.6"
solana-vote-program = "3.0.6"
solana-commitment-config = "3.0.0"
solana-system-interface = "2.0.0"

[[bin]]
name = "rakurai-activation"
path = "src/bin/rakurai_activation_cli.rs"
