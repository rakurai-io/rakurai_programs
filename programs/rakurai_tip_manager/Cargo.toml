[package]
name = "rakurai_tip_manager"
version = "0.1.0"
description = "Rakurai Tip Manager Program"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "rakurai_tip_manager"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { path = "../../../anchor/lang" }
rakurai_activation = { path = "../rakurai_activation", features = ["no-entrypoint"] }
reward_distribution = { path = "../reward_distribution", features = ["no-entrypoint"] }
solana-security-txt = "1.1.1"
solana-program = "2"
