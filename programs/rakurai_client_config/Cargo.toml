[package]
name = "rakurai_client_config"
description = "On-chain validator config: block-engine endpoints, post-pack (P2C) URLs, and virtual-priority maps"
edition = "2021"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "rakurai_client_config"

[features]
anchor-debug = []
cpi = ["no-entrypoint"]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = "1.2.0"
borsh = "1"
solana-program = "3.0.0"
solana-security-txt = "1.1.1"
